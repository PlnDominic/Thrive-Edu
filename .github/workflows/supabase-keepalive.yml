name: Supabase keepalive

# Supabase free-tier projects auto-pause after 7 days with no API activity.
# This runs a lightweight read query every Monday so the project never goes
# a full week untouched.
on:
  schedule:
    # 09:00 UTC every Monday
    - cron: "0 9 * * 1"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ping Supabase
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run supabase:keepalive
